name: ecommerce_bi

services:
  metabase-db:
    image: postgres:15
    container_name: metabase-db
    environment:
      POSTGRES_USER: ${MB_DB_USER:?set MB_DB_USER in .env}
      POSTGRES_PASSWORD: ${MB_DB_PASS:?set MB_DB_PASS in .env}
      POSTGRES_DB: metabase
    volumes:
      - metabase-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MB_DB_USER} -d metabase"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: ${MB_DB_USER}
      MB_DB_PASS: ${MB_DB_PASS}
      MB_DB_HOST: metabase-db
      JAVA_OPTS: "-Xmx1g"
    depends_on:
      metabase-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  metabase-db-data:
